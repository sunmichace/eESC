[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eesc"
version = "0.1.0"
description = "Standardized analysis entry points for the eESC experiment archive."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "matplotlib",
  "numpy",
]

[project.optional-dependencies]
legacy-experiments = [
  "joblib",
  "optuna",
  "scikit-learn",
  "torch",
  "tqdm",
]

[project.scripts]
eesc = "eesc.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

